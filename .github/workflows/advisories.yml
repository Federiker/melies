name: Advisories

# Known vulnerabilities in the Rust crates (cargo-deny, RustSec), in manual runs only. Kept out of the
# Checks workflow so a new advisory never fails an unrelated run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: cargo deny check advisories
