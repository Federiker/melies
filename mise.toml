# Developer tools, pinned (the same versions as kuleshov's, kempelen's and jespersen's). `mise install`
# installs them; scripts/install.bat and scripts/install.sh set up a whole machine.
# Rust itself is pinned in rust-toolchain.toml and installed by rustup. No Bun: FFmpeg and the
# Kokoro files are staged in Rust, with kuleshov's and kempelen's own downloads (crates/stage).
min_version = "2026.10.0"

[settings]
# mise.lock records each tool's exact version and checksums.
lockfile = true

[env]
# Where the tests, the parity test and the benchmark find ffmpeg and ffprobe, and the Kokoro model
# and voices: what `mise run stage` stages. Test-only variables; the library itself never reads the
# environment. To use copies from elsewhere (such as a sibling manuzio checkout's staged
# ../manuzio/assets/tools and ../manuzio/assets/tools/tts), set them in the gitignored
# mise.local.toml, which wins.
MELIES_TOOLS_DIR = "{{config_root}}/tools"
MELIES_SPEECH_DIR = "{{config_root}}/tools/speech"

[tools]
# Lets the `cargo:` tools below install prebuilt binaries instead of compiling.
cargo-binstall = "1.26.0"
"cargo:cargo-nextest" = "0.9.149"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-llvm-cov" = "0.9.1"
cargo-deny = "0.20.2"
typos = "1.51.1"
lychee = "0.24.2"
lefthook = "2.2.2"

# The repository's commands: `mise run <task>` (`mise tasks` lists them). Arguments after the
# task's name are passed on, e.g. `mise run test -p melies`.

# Develop.
[tasks.clean]
description = "Remove build outputs"
run = "cargo clean"

[tasks.fix]
description = "Format the Rust code"
run = "cargo fmt --all"

# FFmpeg and Kokoro for the tests: never bundled with the library or committed (README).
[tasks.stage]
description = "Stage the pinned FFmpeg and the Kokoro model and voices (about 349 MB) in tools/, downloaded once, checksums verified"
run = "cargo run --release -p melies-stage -- {{config_root}}/tools"

# Check.
[tasks.check]
description = "cargo check of the workspace, the stage program included"
run = "cargo check --workspace --all-targets"

[tasks.fmt]
description = "Check the formatting of the Rust code"
run = "cargo fmt --all --check"

[tasks.clippy]
description = "Clippy, warnings denied"
run = "cargo clippy --workspace --all-targets -- --deny warnings"

[tasks.spell]
description = "Spelling (typos.toml)"
run = "typos"

[tasks.links]
description = "Broken links in the Markdown files (lychee.toml)"
run = "lychee --no-progress README.md AGENTS.md CLAUDE.md TODO.md docs"

[tasks.machete]
description = "Unused Rust dependencies"
run = "cargo machete"

[tasks.deny]
description = "Licences, bans and sources (advisories run weekly in CI)"
run = "cargo deny check licenses bans sources"

[tasks.audit]
description = "Advisories, licences, bans and sources"
run = "cargo deny check"

# Test. The tests run FFmpeg: they read MELIES_TOOLS_DIR (see [env]) and fail, naming the folder,
# when it holds no ffmpeg or ffprobe. The model tier reads MELIES_SPEECH_DIR too.
[tasks.test]
description = "The tests (FFmpeg, no model), with nextest, then the doctests (nextest does not run them)"
run = ["cargo nextest run", "cargo test --doc -p melies"]

[tasks."test:model"]
description = "The model tier: the ignored tests that run Kokoro on the CPU (needs `mise run stage`)"
run = "cargo nextest run --profile model --run-ignored only"

[tasks.coverage]
description = "Both tiers with coverage, at 90% of lines and regions or more (the narration needs the model: `mise run stage`)"
run = "cargo llvm-cov nextest --profile model --run-ignored all --fail-under-lines 90 --fail-under-regions 90"

# Measure (local only).
[tasks.bench]
description = "The narration and trailer benchmark on the CPU (docs/performance.md; needs `mise run stage`)"
run = "cargo run --release -p melies --example bench"

# What CI's Checks workflow runs, in its order: the quick checks first, so they fail fast.
[tasks.ci]
description = "Every check CI's light tier runs"
run = [
  { tasks = ["fmt", "spell", "links"] },
  { tasks = ["machete", "deny"] },
  { task = "clippy" },
  { task = "check" },
  { task = "test" },
]
